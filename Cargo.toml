[package]
name = "rat_quikc_lang"
version = "0.1.1"
edition = "2024"
authors = ["0ldm0s <oldmos@gmail.com>"]
description = "基于rat_embed_lang的多语言包装器，提供简洁的API和自动文件加载功能"
license = "LGPL-3.0-or-later"
repository = "https://github.com/0ldm0s/rat_quikc_lang"
homepage = "https://github.com/0ldm0s/rat_quikc_lang"
documentation = "https://docs.rs/rat_quikc_lang"
readme = "README.md"
keywords = ["i18n", "internationalization", "localization", "embed", "translation"]
categories = ["internationalization", "localization", "development-tools"]

[dependencies]
rat_embed_lang = "0.1.1"
toml = "0.8"
serde = { version = "1.0", features = ["derive"] }
thiserror = "1.0"
